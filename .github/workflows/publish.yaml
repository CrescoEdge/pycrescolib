name: Publish pycrescolib to PyPI

on:
  push:
  release:
    types: [published]

jobs:
  # Runs on every push: build the sdist+wheel and validate the packaging
  # metadata (mirrors the Java clients' CI build). Does NOT upload.
  build:
    name: Build & validate distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate metadata
        run: twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Runs only when a GitHub Release is published: publish to PyPI.
  # Uses PyPI Trusted Publishing (OIDC) — no API token secret required.
  # One-time setup: on pypi.org add a Trusted Publisher for this project
  #   (owner: CrescoEdge, repo: pycrescolib, workflow: publish.yaml,
  #    environment: pypi). See https://docs.pypi.org/trusted-publishers/
  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pycrescolib/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
