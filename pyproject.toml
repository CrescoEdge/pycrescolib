[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrescolib"
version = "1.3.0"
description = "Python Cresco Client Library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Cresco Team", email = "info@cresco.io" }]
keywords = ["cresco", "edge-computing", "websockets", "iot", "distributed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "websockets>=10.0",
    "cryptography>=36.0.0",
    "backoff>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CrescoEdge/pycrescolib"
Repository = "https://github.com/CrescoEdge/pycrescolib"
"Cresco Framework" = "https://github.com/CrescoEdge/agent"

[tool.setuptools]
packages = ["pycrescolib"]
license-files = ["LICENSE.txt"]
